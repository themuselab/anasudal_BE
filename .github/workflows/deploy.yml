name: deploy-api

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write        # OIDC
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPO: anasudal/api
  ECS_CLUSTER: anasudal-prod
  ECS_SERVICE: api
  TASK_FAMILY: anasudal-prod-api
  CONTAINER: api

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}   # terraform output gha_deploy_role_arn
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        id: img
        working-directory: backend
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPO}"
          docker build -t "$IMAGE:${GITHUB_SHA::12}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-def.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER }}
          image: ${{ steps.img.outputs.image }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
